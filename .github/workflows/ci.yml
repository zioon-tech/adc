name: ADC CI
on:
  pull_request:
  push:
    branches: [main, "migration/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adc-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      service: ${{ steps.affected.outputs.service }}
      site: ${{ steps.affected.outputs.site }}
      client-tools: ${{ steps.affected.outputs.client-tools }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - id: affected
        run: node scripts/ci/affected.mjs
  secrets:
    uses: zioon-tech/workflows/.github/workflows/secret-scan.yml@c393e2bb7646ec3e3ac889c5548f6c719d3ca2bc
  gui-executor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify the standalone GUI executor
        run: |
          python3 -m venv /tmp/adc-gui-test
          /tmp/adc-gui-test/bin/pip install './examples/gui-executor[test]'
          /tmp/adc-gui-test/bin/python -m pytest examples/gui-executor -q
          /tmp/adc-gui-test/bin/python -m ruff check examples/gui-executor
          /tmp/adc-gui-test/bin/python -m compileall -q examples/gui-executor/adc_gui_executor
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify Android release code without signing credentials
        working-directory: apps/android-node
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
          ./gradlew --no-daemon :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
  service:
    needs: changes
    if: needs.changes.outputs.service == 'true'
    uses: zioon-tech/workflows/.github/workflows/node-ci.yml@c393e2bb7646ec3e3ac889c5548f6c719d3ca2bc
    with:
      package-manager: pnpm
      install: pnpm install --frozen-lockfile
      command: pnpm build && pnpm test:unit && pnpm test:integration && pnpm test:e2e
      release-component: service
      artifact-name: adc-service-${{ github.sha }}
      artifact-path: .release-out/service
  website:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    uses: zioon-tech/workflows/.github/workflows/node-ci.yml@c393e2bb7646ec3e3ac889c5548f6c719d3ca2bc
    with:
      package-manager: pnpm
      install: pnpm install --frozen-lockfile
      command: pnpm --filter @adc/console build && pnpm exec vitest run apps/console/src/public-site.test.ts apps/console/src/file-transfer-visibility.test.ts
      release-component: console-and-site
      artifact-name: adc-console-and-site-${{ github.sha }}
      artifact-path: .release-out/console-and-site
  client-tools:
    needs: changes
    if: needs.changes.outputs.client-tools == 'true'
    uses: zioon-tech/workflows/.github/workflows/node-ci.yml@c393e2bb7646ec3e3ac889c5548f6c719d3ca2bc
    with:
      package-manager: pnpm
      install: pnpm install --frozen-lockfile
      command: pnpm build:node && pnpm build:sdk && pnpm verify:client-tools
      release-component: client-tools
      artifact-name: adc-client-tools-${{ github.sha }}
      artifact-path: .release-out/client-tools
  required:
    name: CI
    runs-on: ubuntu-24.04
    if: always()
    needs: [changes, secrets, gui-executor, android, service, website, client-tools]
    steps:
      - env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false
