name: Production release
on:
  workflow_dispatch:
    inputs:
      component:
        type: choice
        options: [console-and-site, service, client-tools]
        required: true
      ci-run:
        description: Successful main-branch ADC CI run ID
        type: string
        required: true
      check-only:
        description: Validate cloud access, artifact and disk without switching
        type: boolean
        default: true
      retire-inactive-builds:
        description: Reclaim inventoried inactive dependency copies after reference checks
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  release:
    uses: zioon-tech/workflows/.github/workflows/deploy.yml@75121857554619abcfc37b3a468d103ec30cd9e9
    with:
      component: ${{ inputs.component }}
      ci-run: ${{ inputs.ci-run }}
      check-only: ${{ inputs.check-only }}
      retire-inactive-builds: ${{ inputs.retire-inactive-builds }}
