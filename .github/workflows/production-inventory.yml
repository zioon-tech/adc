name: Production disk inventory
on:
  workflow_dispatch:
    inputs:
      kind:
        description: Read-only production inventory
        type: choice
        options: [disk, downloads]
        default: disk
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-${{ github.repository }}-inventory
  cancel-in-progress: false
jobs:
  inventory:
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: zioon-tech/workflows
          ref: c95a126e6ce76bce48d69fe5df916601f84987bf
          path: .production-workflows
          persist-credentials: false
      - name: Inspect disk and release references
        env:
          DEPLOY_ROLE_ARN: ${{ vars.DEPLOY_ROLE_ARN }}
          DEPLOY_OIDC_PROVIDER_ARN: ${{ vars.DEPLOY_OIDC_PROVIDER_ARN }}
          DEPLOY_INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
          INVENTORY_KIND: ${{ inputs.kind }}
        run: python3 scripts/production-inventory.py
