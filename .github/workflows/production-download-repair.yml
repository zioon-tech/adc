name: Repair inventoried production download paths
on:
  workflow_dispatch:
    inputs:
      check-only:
        description: Validate exact production state without modifying configuration
        type: boolean
        default: true
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: production-${{ github.repository }}-service
  cancel-in-progress: false
jobs:
  repair:
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: zioon-tech/workflows
          ref: f2365c046bb40aa9e5cebaba924983e9e7a154d7
          path: .production-workflows
          persist-credentials: false
      - name: Validate or repair inventoried production configuration
        env:
          DEPLOY_ROLE_ARN: ${{ vars.DEPLOY_ROLE_ARN }}
          DEPLOY_OIDC_PROVIDER_ARN: ${{ vars.DEPLOY_OIDC_PROVIDER_ARN }}
          DEPLOY_INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
          CHECK_ONLY: ${{ inputs.check-only }}
        run: python3 scripts/repair-production-downloads.py
