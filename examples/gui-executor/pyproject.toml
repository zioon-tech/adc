[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adc-gui-executor"
version = "0.1.0"
description = "A bounded local GUI actor using the public ADC MCP interface."
requires-python = ">=3.10"
dependencies = ["requests>=2.32,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
adc-gui-executor = "adc_gui_executor.__main__:main"

[tool.setuptools.packages.find]
include = ["adc_gui_executor*"]

[tool.setuptools.package-data]
adc_gui_executor = ["tasks/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
